name: CI

on:
  push:
    branches: [main, codex/project-baseline-fix]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://everest:everest@127.0.0.1:5432/everest_test?schema=public
      B24_MODE: mock
      B24_WRITE_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: everest_test
          POSTGRES_USER: everest
          POSTGRES_PASSWORD: everest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everest -d everest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile when it is not committed yet
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Check Prisma formatting
        run: |
          pnpm prisma:format
          git diff --exit-code -- prisma/schema.prisma

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Apply database migrations
        run: pnpm prisma:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Check standalone production runtime
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          (cd .next/standalone && HOSTNAME=127.0.0.1 PORT=3100 node server.js > /tmp/everest-standalone.log 2>&1 & echo $! > /tmp/everest-standalone.pid)
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          curl --fail --silent http://127.0.0.1:3100/ > /dev/null
          kill "$(cat /tmp/everest-standalone.pid)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
